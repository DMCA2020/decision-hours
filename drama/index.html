      <div class="side-filters"><button data-f="all" class="on">הכל</button><button data-f="groups">קבוצות</button><button data-f="contacts">אנשי קשר</button></div>
      <div class="side-list" id="sideList"></div>
    </aside>
    <div class="island"></div>
    <div class="screen">
      <div class="statusbar">
        <span class="sb-time" id="sbTime">9:41</span>

          <svg viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.3-1.4A10.6 10.6 0 0 0 8 .3 10.6 10.6 0 0 0 .7 3.2L2 4.6a8.7 8.7 0 0 1 6-2.4zm0 3.8c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.7 6.7 0 0 0 8 4.1c-1.8 0-3.5.7-4.7 1.8l1.3 1.4C5.5 6.5 6.7 6 8 6zm0 3.7a1.6 1.6 0 1 0 0 0z"/><circle cx="8" cy="10" r="1.7"/></svg>

        <div class="gavatar" id="groupAvatar"></div>
        <div class="gtitle">
          <div class="gname" id="groupName"></div>
          <div class="gsub" id="groupSub"></div>
        </div>
        <button class="icon" aria-label="שיחת וידאו"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>

        <button class="icon" id="menuBtn" aria-label="תפריט"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>

          <button data-act="theme">החלפת עיצוב</button>
          <button data-act="speed">מהירות: <b id="speedLbl">x1</b></button>
          <button data-act="sound">צלילים: <b id="soundLbl">כבוי</b></button>
          <button data-act="pause">השהיה</button>
          <button data-act="jump">קפיצה לשעה</button>
          <button data-act="restart">התחלה מחדש</button>
        </div>
      </header>

      <button class="pinned" id="pinned" hidden>
        <svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
        <span id="pinnedText"></span>
      </button>

      <main class="chat" id="chat">
        <div class="chat-inner" id="feed"></div>

      <button class="down" id="downBtn" hidden aria-label="להודעה האחרונה">

        <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>

      <footer class="composer">
        <div class="field">
          <button class="icon sm" aria-label="אימוג'י"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
          <input id="input" type="text" placeholder="הודעה" autocomplete="off" enterkeyhint="send">
          <button class="icon sm attach" aria-label="צירוף"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
          <button class="icon sm cam" aria-label="מצלמה"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></button>
        </div>
        <button class="fab" id="sendBtn" aria-label="שליחה">
          <svg class="mic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
          <svg class="send" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </footer>
      <button class="readonly" id="readonly" hidden></button>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet-card" role="dialog" aria-modal="true">
          <div class="sheet-grip"></div>
          <button class="sheet-close" aria-label="סגירה">✕</button>
          <div class="sheet-body" id="sheetBody"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="floor"></div>
</div>
